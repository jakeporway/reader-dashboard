body{font-family:'Space Grotesk',sans-serif;background:#0a0a1a;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}

<script>
const items=[
{cat:'🧠 Behavioral Science × Street Art',nugget:'Banksy\'s shredded painting sold for 25x MORE after it self-destructed. Behavioral economists call this the "IKEA effect" meets scarcity bias — we value what feels rare or broken. The art world literally monetized loss aversion.',conn:'What if newsletters self-destructed after 24 hours?',src:'https://en.wikipedia.org/wiki/Love_is_in_the_Bin',srcLabel:'Wikipedia — Love is in the Bin'},
{cat:'🎨 Design × Octopuses',nugget:'Octopuses have no blind spot — their eyes evolved independently from ours and got the wiring RIGHT (photoreceptors face forward). Human-centered design often means designing around our biological bugs, not features.',conn:'The best designs compensate for human flaws we don\'t even notice.',src:'https://en.wikipedia.org/wiki/Cephalopod_eye',srcLabel:'Wikipedia — Cephalopod Eye Evolution'},
{cat:'🎵 Music × Fungi',nugget:'Scientists hooked electrodes to mushroom mycelium and found electrical signals with patterns eerily similar to human speech — up to 50 distinct "words." A composer turned these into a symphony. The mushrooms got a standing ovation.',conn:'What counts as language when everything is communicating?',src:'https://royalsocietypublishing.org/doi/10.1098/rsos.211926',srcLabel:'Royal Society — Fungal Electrical Signals'},
{cat:'🏙️ Urban Planning × Desire',nugget:'Some universities don\'t pave walkways for new buildings — they wait a year, see where students actually walk through the grass, then pave THOSE paths. They\'re called "desire lines." The best design is observation.',conn:'Where are the desire lines in your audience\'s behavior?',src:'https://99percentinvisible.org/article/least-resistance-desire-paths-can-lead-better-design/',srcLabel:'99% Invisible — Desire Paths'},
{cat:'🧪 Chemistry × Loneliness',nugget:'Loneliness triggers the same brain region as physical pain (dorsal anterior cingulate cortex). Social neuroscientists found that Tylenol — yes, the painkiller — actually reduces feelings of social rejection.',conn:'The body doesn\'t distinguish between a broken bone and a broken heart.',src:'https://journals.sagepub.com/doi/10.1177/0956797610374741',srcLabel:'Psychological Science — Acetaminophen & Social Pain'},
{cat:'📚 Libraries × Rebellion',nugget:'During WWII, the Nazis burned books. So librarians in Vilnius smuggled 3,000+ books under their clothes, in potato sacks, and in coffins. They called themselves the "Paper Brigade." Every book they saved was an act of war.',conn:'Curation has always been resistance.',src:'https://www.penguinrandomhouse.com/books/247908/the-book-smugglers-of-timbuktu-by-charlie-english/',srcLabel:'The Book Thieves — Anders Rydell'},
{cat:'🌊 Oceanography × Memory',nugget:'The ocean has a "memory" — sea surface temperatures from one winter can predict drought conditions TWO YEARS later on the other side of the planet. Scientists call it "re-emergence." The ocean literally remembers.',conn:'What patterns from 2 years ago are shaping your life right now?',src:'https://www.science.org/doi/10.1126/sciadv.abm3468',srcLabel:'Science Advances — Ocean Memory & Climate'},
{cat:'🎭 Improv × Emergency Rooms',nugget:'Medical schools now teach improv comedy to doctors. Why? "Yes, and…" thinking reduces diagnostic errors by 30%. When a doctor says "but" to a patient\'s symptoms, they miss things. Acceptance is literally medicine.',conn:'The funniest skill in comedy is the most life-saving in medicine.',src:'https://journals.sagepub.com/doi/10.1177/23821205211006411',srcLabel:'SAGE — Improv in Medical Education'},
{cat:'🐝 Bees × Democracy',nugget:'When bees choose a new hive, scout bees do waggle dances for their preferred sites. Other bees visit and "vote" by dancing too. The decision is made when 80% converge — no queen decides. It\'s the oldest democracy on Earth.',conn:'The best group decisions happen when everyone does their own research first.',src:'https://press.princeton.edu/books/hardcover/9780691147215/honeybee-democracy',srcLabel:'Princeton — Honeybee Democracy by Thomas Seeley'},
{cat:'🎮 Game Design × Grief',nugget:'A dad whose son passed away found his wife\'s Wii avatar still driving a ghost car in an old Mario Kart time trial. She\'d died years earlier. He never finished the race — just drives beside her. Game designers never planned for digital ghosts, but they made one.',conn:'The most profound features are the ones nobody designed.',src:'https://www.youtube.com/watch?v=gCtSgb-b7zg',srcLabel:'YouTube — The Ghost Car Story'},
{cat:'🧬 Genetics × Cooking',nugget:'Cilantro tastes like soap to ~14% of people — it\'s genetic (OR6A2 gene). But here\'s the twist: if you crush cilantro leaves, it breaks down the aldehydes that trigger the soap taste. Cooking is chemistry that hacks your DNA.',conn:'Sometimes the solution isn\'t avoiding what\'s broken — it\'s processing it differently.',src:'https://flavourjournal.biomedcentral.com/articles/10.1186/2044-7248-1-22',srcLabel:'Flavour Journal — Genetic Basis of Cilantro Preference'},
{cat:'🏛️ Architecture × Intimacy',nugget:'The ideal hallway width for two people to comfortably pass is 48 inches. But research shows that at 36 inches, people make MORE eye contact, smile more, and report feeling more connected. Discomfort creates intimacy.',conn:'The best spaces aren\'t always the most comfortable ones.',src:'https://en.wikipedia.org/wiki/Proxemics',srcLabel:'Wikipedia — Proxemics & Personal Space'},
{cat:'🦠 Microbiology × Art',nugget:'The biggest threat to the Mona Lisa isn\'t thieves — it\'s bacteria. The painting lives in a sealed, climate-controlled case because human breath alone could destroy it. Every visitor is a biological threat. We are literally too alive for art.',conn:'Sometimes love is dangerous to the thing you love.',src:'https://www.smithsonianmag.com/smart-news/scientists-identify-New-threats-mona-lisa-180975040/',srcLabel:'Smithsonian — Microbial Threats to Art'},
{cat:'🌱 Botany × Strategy',nugget:'When a tobacco plant gets eaten by caterpillars, it releases a chemical that attracts the caterpillar\'s predators. It literally calls in an airstrike. Plants can\'t run, so they evolved to be strategic geniuses.',conn:'Constraints don\'t limit strategy — they sharpen it.',src:'https://www.science.org/doi/10.1126/science.1104180',srcLabel:'Science — Plant Indirect Defense Mechanisms'},
{cat:'🎪 Circus × Physics',nugget:'A trapeze artist at the peak of their swing experiences zero gravity — the same weightlessness astronauts feel. For 0.8 seconds, a circus tent and outer space are the same place.',conn:'Wonder doesn\'t require a rocket. Just the right moment.',src:'https://en.wikipedia.org/wiki/Trapeze',srcLabel:'Wikipedia — Trapeze & Aerial Physics'},
{cat:'🗺️ Cartography × Power',nugget:'The Mercator map makes Africa look the same size as Greenland. In reality, Africa is 14x larger. Every "neutral" visualization is a political choice. The map is not the territory — it\'s the mapmaker\'s agenda.',conn:'What invisible distortions live in your default dashboards?',src:'https://thetruesize.com/',srcLabel:'The True Size Of — Interactive Map Comparison'},
{cat:'🧊 Glaciology × Sound',nugget:'Glaciers sing. As ice melts and refreezes, trapped air bubbles vibrate at frequencies that create harmonic tones. Scientists recorded an Antarctic glacier "singing" a song that changes with the weather. The planet has a soundtrack.',conn:'If you listen to anything closely enough, it\'s music.',src:'https://agupubs.onlinelibrary.wiley.com/doi/full/10.1029/2018GL080339',srcLabel:'AGU — Seismic Hum of Ross Ice Shelf'},
{cat:'🎯 Behavioral Econ × Supermarkets',nugget:'Grocery stores put milk at the back so you walk past everything else. But here\'s the deeper trick: they make aisles slightly too narrow for two carts. The awkward "excuse me" dance forces social interaction, which triggers oxytocin, which makes you buy 12% more.',conn:'Every environment you enter was designed to make you do something.',src:'https://en.wikipedia.org/wiki/Supermarket#Store_design',srcLabel:'Wikipedia — Supermarket Psychology & Store Design'},
{cat:'🔬 Neuroscience × Stories',nugget:'When someone tells you a story, your brain waves literally synchronize with the storyteller\'s — a phenomenon called "neural coupling." The better the story, the more your brains become one. Stories are the original mind meld.',conn:'A great newsletter doesn\'t inform readers. It synchronizes with them.',src:'https://www.pnas.org/doi/10.1073/pnas.1008662107',srcLabel:'PNAS — Neural Coupling During Storytelling'},
{cat:'🌌 Astronomy × Indigenous Knowledge',nugget:'Aboriginal Australians mapped the sky using "dark constellations" — shapes formed by the dark dust lanes in the Milky Way, not the stars. Western astronomy looked at what shines. Indigenous astronomy looked at what\'s hidden. Both are maps of the same sky.',conn:'What are you not seeing because you\'re only looking at what\'s bright?',src:'https://www.abc.net.au/science/articles/2009/07/27/2632463.htm',srcLabel:'ABC Science — Australia\'s First Astronomers'},
{cat:'📱 Neuroscience × Technology',nugget:'89% of people experience "phantom vibration syndrome" — feeling your phone buzz when it hasn\'t. Your brain has literally rewired its tactile processing to hallucinate technology. We didn\'t adopt phones. Our nervous systems merged with them.',conn:'What habits have become so deep they\'re now hallucinations?',src:'https://en.wikipedia.org/wiki/Phantom_vibration_syndrome',srcLabel:'Wikipedia — Phantom Vibration Syndrome'},
{cat:'🏺 Japanese Art × Resilience',nugget:'Kintsugi is the Japanese art of repairing broken pottery with gold lacquer — making the cracks MORE beautiful than the original. It\'s rooted in wabi-sabi philosophy: impermanence isn\'t a flaw, it\'s the whole point. The most valuable bowl in the room is the one that shattered.',conn:'What if your portfolio highlighted your failures in gold instead of hiding them?',src:'https://en.wikipedia.org/wiki/Kintsugi',srcLabel:'Wikipedia — Kintsugi: Golden Repair'},
{cat:'🚀 Psychology × Space Travel',nugget:'Astronauts who see Earth from space report a permanent cognitive shift called the "overview effect" — a sudden, overwhelming sense that borders are imaginary and all life is connected. Some describe it as spiritual awakening. NASA didn\'t plan a meditation program. The window was enough.',conn:'What would your work look like if you could see it from orbit?',src:'https://en.wikipedia.org/wiki/Overview_effect',srcLabel:'Wikipedia — The Overview Effect'},
{cat:'⚡ Physics × Plumbing',nugget:'Physicists have made electrons flow like water — literally. In ultra-pure materials at precise temperatures, electrons stop bouncing off atoms individually and start moving as a collective fluid, with viscosity and vortices. Electricity becomes a river. The metaphor became real.',conn:'When does a metaphor stop being a metaphor and start being a discovery?',src:'https://www.quantamagazine.org/physicists-make-electrons-flow-like-water-20260211/',srcLabel:'Quanta Magazine — Electrons Flow Like Water'},
{cat:'🌳 Ecology × Internet',nugget:'Forests have their own internet. Mycorrhizal fungi connect tree roots into networks spanning acres — "mother trees" send carbon and nutrients to seedlings through fungal cables. Trees literally subsidize their children through underground infrastructure. The wood wide web existed 400 million years before WiFi.',conn:'What would it look like to design human networks that nurture newcomers by default?',src:'https://en.wikipedia.org/wiki/Mycorrhizal_network',srcLabel:'Wikipedia — Mycorrhizal Networks (Wood Wide Web)'},
{cat:'🎨 Color Theory × Politics',nugget:'The color pink was used in 1979 to paint a jail cell in Seattle, and inmates became measurably less aggressive within 15 minutes. "Baker-Miller Pink" became famous — but the effect reverses after 30 minutes, and inmates become MORE agitated. Design can manipulate emotion, but not forever.',conn:'Every designed experience has a half-life. Are you designing for the first 15 minutes or the next 30?',src:'https://en.wikipedia.org/wiki/Baker-Miller_pink',srcLabel:'Wikipedia — Baker-Miller Pink'},
{cat:'🐦 Ornithology × Aesthetics',nugget:'Male bowerbirds build elaborate architectural structures decorated with colorful objects — not nests, but art galleries — purely to attract mates. They arrange objects by color gradient, replace wilted flowers daily, and even use forced perspective to make themselves look larger. Evolution invented interior design.',conn:'Beauty isn\'t a human invention. It\'s a survival strategy the whole planet uses.',src:'https://en.wikipedia.org/wiki/Bowerbird',srcLabel:'Wikipedia — Bowerbirds & Aesthetic Evolution'},
{cat:'🧮 Mathematics × Sunflowers',nugget:'Sunflowers arrange their seeds in spirals that follow the Fibonacci sequence — 34 spirals one way, 55 the other. This isn\'t coincidence; it\'s the mathematically optimal packing to fit the most seeds in the least space. Nature solved a problem mathematicians took centuries to prove.',conn:'What if the most efficient solution to your hardest problem is already growing in a field somewhere?',src:'https://en.wikipedia.org/wiki/Fermat%27s_spiral',srcLabel:'Wikipedia — Fermat\'s Spiral & Phyllotaxis'},
{cat:'🎻 Music × Surgery',nugget:'A violinist played her instrument DURING her own brain surgery while doctors removed a tumor near her motor cortex. Her playing was the real-time feedback — if a note went off, surgeons knew they\'d touched something critical. Art became a surgical instrument.',conn:'The most valuable monitoring system might be the skill you\'re trying to save.',src:'https://www.bbc.com/news/health-51377092',srcLabel:'BBC — Violinist Plays During Brain Surgery'},
{cat:'🐙 Marine Biology × Materials Science',nugget:'The blue-ringed octopus can change skin texture AND color in 200 milliseconds — faster than a blink. Engineers studying this created "programmable matter" that shapeshifts on command. The softest animal in the ocean is inspiring the hardest engineering problems.',conn:'The best technology doesn\'t fight nature. It plagiarizes it.',src:'https://en.wikipedia.org/wiki/Blue-ringed_octopus',srcLabel:'Wikipedia — Blue-Ringed Octopus & Chromatophores'},
{cat:'🏥 Hospital Design × Nature',nugget:'Patients whose hospital windows faced trees recovered a full day faster and needed 50% fewer painkillers than those facing a brick wall. Roger Ulrich\'s 1984 study literally proved that a view of nature is medicine. Architecture is healthcare.',conn:'How much of your environment is brick wall, and how much is trees?',src:'https://pubmed.ncbi.nlm.nih.gov/6143402/',srcLabel:'Science — View Through a Window (Ulrich 1984)'},
{cat:'🕷️ Spiders × Engineering',nugget:'Spider silk is 5x stronger than steel by weight, stretches 30% without breaking, and is completely biodegradable. We\'ve spent decades trying to synthesize it. The spider does it at room temperature with flies and water. Our trillion-dollar materials industry got outperformed by a bug.',conn:'The most advanced factory on Earth fits in a web.',src:'https://en.wikipedia.org/wiki/Spider_silk',srcLabel:'Wikipedia — Spider Silk Mechanical Properties'},
{cat:'💤 Sleep Science × Creativity',nugget:'Salvador Dalí and Thomas Edison both used the same trick: hold a heavy object while falling asleep, and when it drops and wakes you, capture the ideas from that hypnagogic twilight state. In 2021, scientists at MIT confirmed it works — that liminal sleep stage genuinely boosts creative problem-solving by 6x.',conn:'Your best ideas might live in the 30 seconds before you fall asleep.',src:'https://www.science.org/doi/10.1126/sciadv.abj5866',srcLabel:'Science Advances — Sleep Onset & Creative Insight'},
{cat:'🐋 Whale Songs × Seismology',nugget:'Fin whale calls are so low-frequency (20 Hz) that they register on earthquake seismographs. Scientists accidentally discovered they could use whale songs bouncing off the ocean floor to map geological structures. Whales have been doing sonar geology for 30 million years.',conn:'What signals are you accidentally generating that someone else could use?',src:'https://www.science.org/doi/10.1126/science.abf3962',srcLabel:'Science — Fin Whale Songs Illuminate Ocean Crust'},
{cat:'🧠 Neuroscience × Architecture',nugget:'Astrocytes — star-shaped brain cells once dismissed as mere scaffolding — actually outnumber neurons and supervise them. A 2025 trio of papers in Science showed astrocytes wrap millions of synapses and tune your mood, alertness, and anxiety. The brain\'s real managers aren\'t neurons. They\'re the support staff.',conn:'Who in your organization is dismissed as \'support\' but actually runs everything?',src:'https://www.quantamagazine.org/once-thought-to-support-neurons-astrocytes-turn-out-to-be-in-charge-20260130/',srcLabel:'Quanta — Astrocytes Turn Out To Be in Charge'},
{cat:'🦇 Navigation × Landmarks',nugget:'Scientists strapped brain-recording devices to Egyptian fruit bats and released them on a remote Tanzanian island. The bats\' internal compass didn\'t use magnetic fields or stars — it anchored to landmarks and built a mental map from scratch. Your sense of direction is literally made of memories of places.',conn:'What landmarks anchor your internal compass when everything else is unfamiliar?',src:'https://www.quantamagazine.org/how-animals-build-a-sense-of-direction-20260121/',srcLabel:'Quanta — How Animals Build a Sense of Direction'},
{cat:'🎭 Theater × Prisons',nugget:'In Italy, inmates at Rebibbia prison perform Shakespeare for public audiences. Recidivism among actor-inmates drops to 6% vs the national 68%. The Bard didn\'t write rehabilitation programs — but inhabiting another person\'s story literally rewires your sense of self.',conn:'What story could you inhabit that would change who you become?',src:'https://en.wikipedia.org/wiki/Caesar_Must_Die',srcLabel:'Wikipedia — Caesar Must Die (Taviani Brothers)'},
{cat:'🌿 Ecology × Accounting',nugget:'Costa Rica pays landowners NOT to cut down trees — a program called Payments for Ecosystem Services. Since 1997, forest cover has doubled from 21% to 60%. They literally invented a line item on a national balance sheet for \'leaving things alone.\' Doing nothing became an economic product.',conn:'What would happen if you got paid for what you chose NOT to do?',src:'https://en.wikipedia.org/wiki/Payments_for_ecosystem_services',srcLabel:'Wikipedia — Payments for Ecosystem Services'},
{cat:'🎵 Music × Neonatal Care',nugget:'Premature babies who hear live music (a parent singing, not recorded) show measurably better oxygen saturation, weight gain, and shorter hospital stays. The mechanism isn\'t the melody — it\'s that live singing synchronizes the parent\'s and baby\'s heartbeats. The first duet you ever performed was with your mother\'s pulse.',conn:'What\'s the difference between content and presence?',src:'https://pediatrics.aappublications.org/content/131/5/902',srcLabel:'AAP Pediatrics — Live Music & Premature Infants'},
{cat:'🏗️ Engineering × Termites',nugget:'Termite mounds in Zimbabwe maintain a constant 87°F inside despite 104°F days and 35°F nights — with zero electricity. Architect Mick Pearce copied the termites\' ventilation system for Eastgate Centre in Harare, which uses 90% less energy than conventional buildings. A bug solved the climate crisis for one building.',conn:'The answers to our hardest engineering problems might already have 200 million years of R&D behind them.',src:'https://en.wikipedia.org/wiki/Eastgate_Centre,_Harare',srcLabel:'Wikipedia — Eastgate Centre Biomimicry'},
{cat:'📊 Data Science × Wine',nugget:'In blind taste tests, when told a wine costs $90 instead of $10, people\'s brains literally produce more pleasure — fMRI scans show increased activity in the medial orbitofrontal cortex. The expensive wine doesn\'t taste better. Your brain manufactures the pleasure from the price tag. Every data label you put on a chart does the same thing.',conn:'How much of what you experience is the thing itself vs the story you were told about it?',src:'https://www.pnas.org/doi/10.1073/pnas.0706929105',srcLabel:'PNAS — Marketing Actions Can Modulate Neural Representations of Experienced Pleasantness'},
{cat:'🧊 Cryobiology × Philosophy',nugget:'Wood frogs freeze solid every winter — no heartbeat, no breathing, no brain activity — then thaw in spring and hop away. Up to 65% of their body water turns to ice. They are, by every clinical definition, dead. Then they are alive again. The line between life and death is apparently seasonal.',conn:'What things in your life look dead but are actually just frozen, waiting for the right conditions?',src:'https://en.wikipedia.org/wiki/Rana_sylvatica',srcLabel:'Wikipedia — Wood Frog Cryoprotection'},
{cat:'🎨 Neuroscience × Color',nugget:'There is a color called \'eigengrau\' — the dark gray you see when you close your eyes. It is not black. Your visual cortex generates its own faint light, a neural screen saver running even when there is zero input. You have never experienced true darkness. Your brain won\'t allow it.',conn:'What are you filling with noise because silence feels impossible?',src:'https://en.wikipedia.org/wiki/Eigengrau',srcLabel:'Wikipedia — Eigengrau (Brain Gray)'},
{cat:'🐜 Ant Colonies × Algorithms',nugget:'Ant colonies solve the Traveling Salesman Problem — an optimization puzzle that stumps supercomputers — in minutes, using zero central planning. Each ant follows two rules: follow pheromones, and leave pheromones. From stupidity times millions emerges genius. Computer scientists now use \'ant colony optimization\' to route internet traffic.',conn:'What problems in your org could be solved by dumber agents with better feedback loops?',src:'https://en.wikipedia.org/wiki/Ant_colony_optimization_algorithms',srcLabel:'Wikipedia — Ant Colony Optimization'},
{cat:'🫀 Cardiology × Music Production',nugget:'Hit songs cluster around 120 BPM — almost exactly the rhythm of a brisk walk and double the resting heartbeat. Spotify\'s data scientists found that workout playlists peak at 120-130 BPM not because people choose them, but because the body physically synchronizes to that tempo. Every hit song is a pacemaker.',conn:'What invisible biological rhythms are secretly driving your audience\'s preferences?',src:'https://en.wikipedia.org/wiki/Tempo#Beats_per_minute',srcLabel:'Wikipedia — Tempo, BPM & Biological Synchronization'},
{cat:'🪨 Geology × Memory',nugget:'Zircon crystals in Western Australia are 4.4 billion years old — older than the oceans, older than life itself. They formed when Earth was a molten hellscape and somehow survived everything since: bombardment, tectonics, erosion. The oldest object you can hold in your hand remembers a planet that no longer exists.',conn:'What\'s the oldest surviving artifact in your organization, and what does it remember that everyone has forgotten?',src:'https://en.wikipedia.org/wiki/Jack_Hills',srcLabel:'Wikipedia — Jack Hills Zircon (Oldest Minerals)'},
{cat:'🍄 Mycology × Computing',nugget:'Researcher Andrew Adamatzky built a working computer using slime mold (Physarum polycephalum). The organism naturally finds shortest paths between food sources and can implement logic gates. It\'s slower than silicon but self-healing, biodegradable, and runs on oats. We\'re one breakthrough away from mushroom laptops.',conn:'What if the next computing revolution is grown, not manufactured?',src:'https://en.wikipedia.org/wiki/Physarum_polycephalum',srcLabel:'Wikipedia — Physarum polycephalum & Biological Computing'},
{cat:'🏊 Fluid Dynamics × Crowds',nugget:'Pedestrians in dense crowds move exactly like water molecules — physicists proved this by applying Navier-Stokes fluid equations to footage of Hajj pilgrimages. Above 6 people per square meter, individuals lose agency and human crowds literally become liquid, complete with waves, turbulence, and deadly \'crowd crush\' vortices.',conn:'At what density does your community stop being individuals and start being a current?',src:'https://en.wikipedia.org/wiki/Crowd_psychology',srcLabel:'Wikipedia — Crowd Dynamics & Fluid Modeling'},
];
let spinning=false,lastIdx=-1;
function pull(){
  if(spinning)return;
  spinning=true;
  const btn=document.getElementById('lever'),nug=document.getElementById('nugget'),cat=document.getElementById('cat'),con=document.getElementById('conn'),srcEl=document.getElementById('src');
  btn.classList.add('spinning');btn.textContent='🎰 ...';nug.style.opacity='0.3';con.style.opacity='0';srcEl.innerHTML='';
  let flicks=0,maxFlicks=14;
  const iv=setInterval(()=>{
    cat.textContent=items[Math.floor(Math.random()*items.length)].cat;
    flicks++;
    if(flicks>=maxFlicks){
      clearInterval(iv);
      let idx;do{idx=Math.floor(Math.random()*items.length)}while(idx===lastIdx);lastIdx=idx;
      const c=items[idx];
      cat.textContent=c.cat;nug.innerHTML=c.nugget;con.textContent='💭 '+c.conn;
      srcEl.innerHTML='<a href="'+c.src+'" target="_blank" rel="noopener">📎 '+c.srcLabel+'</a>';
      nug.style.opacity='1';con.style.opacity='0.7';
      btn.classList.remove('spinning');btn.textContent='⚡ PULL';spinning=false;sparkle();
    }
  },90);
}
function sparkle(){
  const d=document.getElementById('display');
  ['✨','💫','⚡','🌟','💜','🔮'].forEach((e,i)=>{
    const s=document.createElement('span');s.className='sparkle';s.textContent=e;
    s.style.left=Math.random()*80+10+'%';s.style.top=Math.random()*80+10+'%';
    d.appendChild(s);setTimeout(()=>s.remove(),1000);
  });
}
</script>
</body>
